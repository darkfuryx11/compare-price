<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ราคานำเข้า">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>ต้นทุนนำเข้า · จีน→ไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#FBFAF7;--bg-card:#FFFFFF;--bg-secondary:#F1EFE8;--bg-inset:#F5F4EF;
  --text:#1A1916;--text-2:#6B6760;--text-3:#9C978C;
  --border:rgba(22,20,14,0.12);--border-strong:rgba(22,20,14,0.20);
  --accent:#1D9E75;--accent-soft:rgba(29,158,117,0.12);
  --pos-bg:rgba(29,158,117,0.14);--pos:#15835F;
  --neg-bg:rgba(199,71,54,0.13);--neg:#C0432F;
  --r-lg:18px;--r-md:12px;--r-sm:9px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior:none;}
body{
  background:var(--bg-app);color:var(--text);
  font-family:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100dvh;
}
#root{max-width:480px;margin:0 auto;padding-bottom:max(env(safe-area-inset-bottom,0px),24px);}
/* desktop: 2-column layout */
.mobile-only{display:block;}
.desktop-only{display:none;}
.mobile-hidden{display:none;}
.col-hd{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:12px;padding:0 2px;}
@media(min-width:900px){
  #root{max-width:1400px;}
  .app{padding:6px 24px 4px;}
  .dual-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  .mobile-only{display:none;}
  .desktop-only{display:block;}
  .mobile-hidden{display:block;}
  .fab-save{right:24px;}

  /* === desktop column grid: suppliers / competitors side-by-side === */
  .sup-col-grid{display:grid;gap:10px;margin-bottom:10px;align-items:stretch;}
  .sup-col-grid .sup-row{position:relative;flex-direction:column;align-items:stretch;margin-bottom:0;padding:14px 12px 12px;box-sizing:border-box;}
  .sup-col-grid .sup-col{gap:9px;}
  /* top section: rank(abs) + big image centered + name */
  .sup-col-grid .sup-name-row{flex-direction:column;align-items:center;gap:7px;padding-top:24px;padding-bottom:11px;border-bottom:0.5px solid var(--border);position:relative;}
  .sup-col-grid .imgthumb{width:120px!important;height:120px!important;border-radius:14px!important;}
  .sup-col-grid .sup-rank{position:absolute;top:0;left:0;}
  .sup-col-grid .sup-name-input{text-align:center;font-size:13px;}
  /* delete button floats top-right of card */
  .sup-col-grid .delbtn{position:absolute;top:6px;right:6px;height:26px;width:26px;}
  /* single-column fields inside card */
  .sup-col-grid .sup-fields{grid-template-columns:1fr;}
  .sup-col-grid .sup-inputwrap{min-height:38px;}
  .sup-col-grid .sup-inputwrap input,.sup-col-grid .sup-autofill .av{font-size:14px;}
  .sup-col-grid .sf-label{font-size:10px;}
  .sup-col-grid .mode-chips button{font-size:10.5px;min-height:24px;padding:2px 7px;}
  /* contact row compact */
  .sup-col-grid .sup-meta-wrap{min-height:30px;}
  .sup-col-grid .sup-meta-wrap input{font-size:11.5px;}
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* app shell */
.app{padding:6px 16px 4px;}
.appbar{
  display:flex;align-items:center;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-bottom:14px;
}
.appbar .title{flex:1;font-size:15px;font-weight:500;letter-spacing:-0.01em;text-align:center;}
.appbar .title small{display:block;font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:0;margin-top:1px;}
.iconbtn{
  width:38px;height:38px;flex:none;border-radius:10px;border:0.5px solid var(--border);
  background:var(--bg-card);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;-webkit-appearance:none;appearance:none;transition:border-color .15s,color .15s;
}
.iconbtn.accent{border-color:var(--accent);color:var(--accent);}

/* name row */
.name-row{display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border);margin-bottom:14px;padding-bottom:12px;}
.name-input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);padding:6px 0;}
.name-input::placeholder{color:var(--text-3);font-weight:400;}
.name-saved{font-size:11px;color:var(--pos);font-weight:500;white-space:nowrap;animation:fade-out 1.5s forwards;}
@keyframes fade-out{0%,60%{opacity:1;}100%{opacity:0;}}
.name-new-btn{border:none;background:transparent;cursor:pointer;padding:4px 8px;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--text-3);-webkit-appearance:none;appearance:none;border-radius:6px;white-space:nowrap;}

/* rate bar */
.ratebar{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);margin-bottom:14px;cursor:pointer;}
.ratebar .rb-left{display:flex;flex-direction:column;gap:3px;}
.ratebar .rb-label{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--accent);position:relative;flex:none;}
.livedot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--accent);opacity:.32;animation:pulse 1.9s ease-out infinite;}
.livedot.offline{background:var(--text-3);}
.livedot.offline::after{animation:none;background:var(--text-3);}
@keyframes pulse{0%{transform:scale(.7);opacity:.45;}70%{transform:scale(2.1);opacity:0;}100%{opacity:0;}}
.live-txt{color:var(--accent);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;}
.live-txt.offline{color:var(--text-3);}
.ratebar .rate-val{font-size:18px;font-weight:500;letter-spacing:-0.01em;}
.ratebar .rate-val small{font-size:12.5px;color:var(--text-2);font-weight:400;}
.ratebar .rb-right{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.ratebar .rb-delta{font-size:11.5px;font-weight:500;}
.ratebar .rb-time{font-size:10.5px;color:var(--text-3);white-space:nowrap;}

/* mode toggle */
.modetoggle{display:flex;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:var(--r-md);padding:3px;margin-bottom:16px;gap:3px;}
.modetoggle button{flex:1;min-height:44px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--text-2);font-weight:400;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s;-webkit-appearance:none;appearance:none;}
.modetoggle button.active{background:var(--bg-card);color:var(--text);font-weight:500;border:0.5px solid var(--border);}
.modetoggle button .arr{color:var(--text-3);}
.modetoggle button.active .arr{color:var(--accent);}

/* mode chips */
.mode-chips{display:flex;gap:2px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:7px;padding:2px;}
.mode-chips button{padding:3px 9px;border:none;border-radius:5px;font-family:inherit;font-size:11px;font-weight:500;color:var(--text-3);background:transparent;cursor:pointer;min-height:26px;-webkit-appearance:none;appearance:none;}
.mode-chips button.active{background:var(--bg-card);color:var(--text);border:0.5px solid var(--border);}
.ccy-chips{display:flex;gap:2px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:7px;padding:2px;flex-wrap:wrap;}
.ccy-chips button{padding:2px 7px;border:none;border-radius:5px;font-family:inherit;font-size:11px;font-weight:500;color:var(--text-3);background:transparent;cursor:pointer;min-height:24px;-webkit-appearance:none;appearance:none;white-space:nowrap;}
.ccy-chips button.active{background:var(--accent);color:#fff;}

/* shared qty card */
.qty-bar{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;}
.qty-bar-label{font-size:12px;color:var(--text-2);font-weight:500;flex:none;}
.qty-bar-input{display:flex;align-items:center;gap:6px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:8px;padding:0 11px;min-height:40px;flex:1;transition:border-color .15s;}
.qty-bar-input:focus-within{border-color:var(--accent);}
.qty-bar-input input{border:none;background:transparent;outline:none;font-family:inherit;font-size:16px;font-weight:500;color:var(--text);width:100%;padding:0;font-variant-numeric:tabular-nums;}
.qty-bar-input .qs{font-size:12px;color:var(--text-3);}

/* supplier / competitor rows */
.sup-row{display:flex;align-items:flex-start;gap:8px;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);padding:12px 8px 12px 14px;margin-bottom:10px;transition:border-color .15s,background .15s;}
.sup-row.best{border-color:var(--accent);background:var(--accent-soft);}
.sup-col{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;}
.sup-name-row{display:flex;align-items:center;gap:8px;}
.sup-rank{width:22px;height:22px;border-radius:50%;background:var(--bg-inset);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-3);flex:none;}
.sup-row.best .sup-rank{background:var(--accent);color:#fff;border-color:transparent;}
.sup-name-input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);padding:3px 0;}
.sup-name-input::placeholder{color:var(--text-3);font-weight:400;}
.sup-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sup-field{display:flex;flex-direction:column;gap:4px;}
.sup-field .sf-label{font-size:10.5px;color:var(--text-3);}
.sup-inputwrap{display:flex;align-items:center;gap:5px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:8px;padding:0 10px;min-height:44px;transition:border-color .15s;}
.sup-inputwrap:focus-within{border-color:var(--accent);background:var(--bg-card);}
.sup-row.best .sup-inputwrap{background:rgba(255,255,255,0.65);}
.sup-row.best .sup-inputwrap:focus-within{background:#fff;}
.sup-inputwrap .sp{font-size:14px;color:var(--text-3);font-weight:500;flex:none;}
.sup-inputwrap input{border:none;background:transparent;outline:none;font-family:inherit;font-size:16px;font-weight:500;color:var(--text);width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums;}
.sup-inputwrap input::placeholder{color:var(--text-3);font-weight:400;}
.sup-derived{font-size:11.5px;color:var(--accent);font-weight:500;}
.sup-autofill{display:flex;align-items:center;gap:5px;background:var(--accent-soft);border:0.5px solid var(--accent);border-radius:8px;padding:0 10px;min-height:44px;}
.sup-autofill .sp{font-size:14px;color:var(--accent);font-weight:500;flex:none;}
.sup-autofill .av{font-size:16px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;flex:1;}
.sup-autofill .af{font-size:10px;color:var(--accent);white-space:nowrap;}

/* contact info */
.sup-contact-row{display:flex;flex-direction:column;gap:5px;margin-top:2px;}
.sup-meta-wrap{display:flex;align-items:center;gap:6px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:7px;padding:0 9px;min-height:34px;transition:border-color .15s;}
.sup-meta-wrap:focus-within{border-color:var(--accent);}
.sup-row.best .sup-meta-wrap{background:rgba(255,255,255,0.55);}
.sup-meta-wrap .sm{font-size:12px;color:var(--text-3);flex:none;}
.sup-meta-wrap input{border:none;background:transparent;outline:none;font-family:inherit;font-size:12.5px;color:var(--text);width:100%;min-width:0;padding:0;}
.sup-meta-wrap input::placeholder{color:var(--text-3);}
.sup-open-btn{border:none;background:transparent;cursor:pointer;color:var(--accent);font-size:11px;font-weight:500;font-family:inherit;padding:0 2px;flex:none;-webkit-appearance:none;white-space:nowrap;}

.delbtn{width:32px;height:44px;border:none;background:transparent;cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center;flex:none;border-radius:8px;-webkit-appearance:none;appearance:none;}
.addrow-btn{width:100%;min-height:44px;border:0.5px dashed var(--border-strong);background:transparent;border-radius:var(--r-md);color:var(--text-2);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;-webkit-appearance:none;appearance:none;transition:border-color .15s,color .15s;}
.addrow-btn:active{border-color:var(--accent);color:var(--accent);}

/* sell card */
.card{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;}
.card-label{font-size:11.5px;color:var(--text-2);font-weight:500;letter-spacing:.01em;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field .fl{font-size:11px;color:var(--text-3);font-weight:400;}
.inputwrap{display:flex;align-items:center;gap:6px;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:0 12px;min-height:52px;transition:border-color .15s;}
.inputwrap:focus-within{border-color:var(--accent);background:var(--bg-card);}
.inputwrap .pfx{font-size:17px;color:var(--text-3);font-weight:500;}
.inputwrap .sfx{font-size:12px;color:var(--text-3);white-space:nowrap;}
.inputwrap input{border:none;background:transparent;outline:none;font-family:inherit;font-size:19px;font-weight:500;color:var(--text);width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums;}
.inputwrap input::placeholder{color:var(--text-3);font-weight:400;}

/* fees */
.fees-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;}
.fees-head .ft{font-size:11.5px;color:var(--text-2);font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
.fees-head .fc{font-size:11.5px;color:var(--text-3);}
.feerow{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);padding:7px 8px 7px 12px;margin-bottom:9px;}
.feerow.empty{border-style:dashed;background:transparent;}
.feerow .fname{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:inherit;font-size:14px;color:var(--text);font-weight:400;padding:8px 0;}
.feerow .fname::placeholder{color:var(--text-3);}
.feerow .famt{width:62px;border:none;background:transparent;outline:none;font-family:inherit;font-size:15px;font-weight:500;color:var(--text);text-align:right;padding:8px 0;font-variant-numeric:tabular-nums;}
.feerow .famt::placeholder{color:var(--text-3);font-weight:400;}
.unittoggle{display:flex;background:var(--bg-inset);border:0.5px solid var(--border);border-radius:8px;padding:2px;flex:none;}
.unittoggle button{width:30px;height:32px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text-3);font-weight:500;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none;}
.unittoggle button.on{background:var(--accent);color:#fff;}
.addfee{width:100%;min-height:46px;border:0.5px dashed var(--border-strong);background:transparent;border-radius:var(--r-md);color:var(--text-2);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;-webkit-appearance:none;appearance:none;transition:border-color .15s,color .15s;}
.addfee:active{border-color:var(--accent);color:var(--accent);}
.reset-fees-btn{padding:3px 9px;border:0.5px solid var(--border-strong);background:transparent;border-radius:6px;color:var(--text-3);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;-webkit-appearance:none;appearance:none;transition:border-color .15s,color .15s;}
.reset-fees-btn:active{border-color:var(--accent);color:var(--accent);}
.subtab-bar{display:flex;gap:2px;padding:4px 16px 10px;border-bottom:0.5px solid var(--border);margin-bottom:2px;}
.subtab-bar button{padding:5px 14px;border:none;background:transparent;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;color:var(--text-3);cursor:pointer;-webkit-appearance:none;appearance:none;}
.subtab-bar button.active{background:var(--bg-inset);color:var(--text-1);font-weight:600;}
.sup-cost-box{margin-top:10px;padding:8px 10px;background:var(--bg-inset);border-radius:var(--r-sm);border:0.5px solid var(--border);}
.sup-cost-box .scb-row{display:flex;align-items:baseline;justify-content:space-between;gap:4px;}
.sup-cost-box .scb-label{font-size:11px;color:var(--text-3);flex-shrink:0;}
.sup-cost-box .scb-val{font-size:14px;font-weight:600;color:var(--text-1);font-family:var(--mono);}
.sup-cost-box .scb-val small{font-size:10px;font-weight:400;color:var(--text-3);margin-left:1px;}
.sup-cost-box .scb-total{font-size:11px;color:var(--text-3);margin-top:2px;font-family:var(--mono);}
.best .sup-cost-box .scb-val{color:var(--accent);}
.cost-box-wrap{position:relative;}
.cost-tooltip{display:none;position:absolute;bottom:calc(100% + 4px);left:-4px;right:-4px;background:var(--bg-card);border:0.5px solid var(--border-strong);border-radius:10px;padding:10px 12px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.18);pointer-events:none;min-width:180px;}
.cost-box-wrap:hover .cost-tooltip{display:block;}
.ct-row{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0;font-size:11px;}
.ct-row.ct-total{border-top:0.5px solid var(--border);margin-top:4px;padding-top:5px;}
.ct-row .ct-label{color:var(--text-3);}
.ct-row.ct-total .ct-label{color:var(--text-1);font-weight:500;}
.ct-row .ct-val{font-family:var(--mono);color:var(--text-2);}
.ct-row.ct-total .ct-val{color:var(--accent);font-weight:600;}
.divider-soft{height:0.5px;background:var(--border);margin:14px 0;}

/* compare result */
.cmp-result{background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:18px 17px;margin-top:16px;}
.cmp-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.cmp-table{display:flex;flex-direction:column;gap:6px;}
.cmp-item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--r-md);background:var(--bg-card);border:0.5px solid var(--border);}
.cmp-item.best{background:var(--pos-bg);border-color:var(--pos);}
.cmp-rank{width:24px;height:24px;border-radius:50%;background:var(--bg-inset);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-3);flex:none;}
.cmp-item.best .cmp-rank{background:var(--pos);color:#fff;border-color:transparent;}
.cmp-name{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmp-item.best .cmp-name{color:var(--pos);}
.cmp-vals{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;}
.cmp-unit{font-size:17px;font-weight:500;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.cmp-item.best .cmp-unit{color:var(--pos);}
.cmp-sub{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;}
.cmp-diff{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--neg);}
.cmp-item.best .cmp-diff{color:var(--pos);font-size:11px;}
.cmp-note{margin-top:13px;padding-top:13px;border-top:0.5px solid var(--border);font-size:12.5px;color:var(--text-2);line-height:1.6;}
.cmp-empty{text-align:center;padding:28px 16px;color:var(--text-3);font-size:13px;line-height:1.7;}

/* margin (best supplier) */
.margin-section{margin-top:15px;border-top:0.5px solid var(--border);padding-top:15px;}
.margin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.margin-head .mh{font-size:12.5px;color:var(--text-2);font-weight:500;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:500;padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums;}
.badge.pos{background:var(--pos-bg);color:var(--pos);}
.badge.neg{background:var(--neg-bg);color:var(--neg);}
.badge svg{width:13px;height:13px;}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:0.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;}

.mstat .ml{font-size:11px;color:var(--text-2);}
.mstat .mv{font-size:16px;font-weight:500;letter-spacing:-0.01em;}
.mstat .mv.pos{color:var(--pos);}
.mstat .mv.neg{color:var(--neg);}

/* product list */
.pcard{display:flex;align-items:center;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);padding:13px 8px 13px 15px;margin-bottom:10px;gap:8px;}
.pcard-body{flex:1;min-width:0;cursor:pointer;}
.pcard-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);flex-wrap:wrap;}
.pcard-tag{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);}
.pcard-tag.rev{background:var(--bg-inset);color:var(--text-3);}
.pcard-val{font-variant-numeric:tabular-nums;}
.list-empty{text-align:center;padding:48px 20px;color:var(--text-3);font-size:13.5px;line-height:1.7;}

.hint{font-size:11.5px;color:var(--text-3);text-align:center;padding:10px 0 6px;}

/* floating save button */
.fab-save{
  position:fixed;
  right:max(env(safe-area-inset-right,0px) + 20px, 20px);
  bottom:max(env(safe-area-inset-bottom,0px) + 20px, 20px);
  z-index:999;
  display:flex;align-items:center;gap:9px;

  padding:0 20px 0 16px;height:52px;
  font-family:inherit;font-size:15px;font-weight:500;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  box-shadow:0 4px 18px rgba(29,158,117,0.38),0 1px 4px rgba(0,0,0,0.12);

}
.fab-save:active{transform:scale(0.95);box-shadow:0 2px 8px rgba(29,158,117,0.3);}
.fab-save.flash{background:#15835F;}

/* image thumb */
.imgthumb{border-radius:8px;overflow:hidden;border:0.5px solid var(--border);background:var(--bg-inset);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.imgthumb img{width:100%;height:100%;object-fit:cover;}
.it-icon{font-size:14px;opacity:.35;user-select:none;line-height:1;}
.imgpop{position:absolute;z-index:200;top:calc(100% + 5px);left:0;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);box-shadow:0 4px 20px rgba(0,0,0,0.13);padding:8px 10px;display:flex;gap:7px;align-items:center;min-width:210px;}
.imgpop input{flex:1;border:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--text);background:transparent;min-width:0;}
.imgpop input::placeholder{color:var(--text-3);}
.imgpop-ok{border:none;background:var(--accent);color:#fff;border-radius:7px;padding:5px 10px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;-webkit-appearance:none;flex:none;}
.imgpop-del{border:none;background:transparent;cursor:pointer;color:var(--text-3);font-size:14px;padding:2px 4px;-webkit-appearance:none;line-height:1;flex:none;}
/* investment summary */
.invest-card{background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:18px 17px;margin-top:16px;}

.invest-verdict{border-radius:var(--r-md);padding:11px 14px;margin-bottom:13px;display:flex;flex-direction:column;gap:3px;}
.invest-verdict.pos{background:var(--pos-bg);}
.invest-verdict.warn{background:rgba(214,155,38,0.11);}
.invest-verdict.neg{background:var(--neg-bg);}
.invest-verdict.neutral{background:var(--bg-inset);}
.iv-label{font-size:15px;font-weight:600;}
.invest-verdict.pos .iv-label{color:var(--pos);}
.invest-verdict.warn .iv-label{color:#A07800;}
.invest-verdict.neg .iv-label{color:var(--neg);}
.invest-verdict.neutral .iv-label{color:var(--text-2);}
.iv-detail{font-size:12px;color:var(--text-2);}
.invest-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:0.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:11px;}
.istat{background:var(--bg-secondary);padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
.istat .is-label{font-size:10.5px;color:var(--text-3);}
.istat .is-val{font-size:16px;font-weight:500;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.istat .is-val.pos{color:var(--pos);}
.istat .is-val.neg{color:var(--neg);}
.istat .is-sub{font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;}
.invest-row{font-size:12.5px;color:var(--text-2);padding:3px 2px;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.ir-dot{width:5px;height:5px;border-radius:50%;background:var(--text-3);flex:none;}
.invest-comp{font-size:12.5px;margin-top:5px;padding:9px 12px;border-radius:var(--r-sm);border:0.5px solid;}
.invest-comp.pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(21,131,95,0.3);}
.invest-comp.neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(192,67,47,0.3);}

/* login */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:var(--bg-app);}
.login-card{width:100%;max-width:340px;background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:32px 24px 28px;display:flex;flex-direction:column;gap:20px;}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}

.login-logo .logo-title{font-size:16px;font-weight:500;letter-spacing:-0.01em;}
.login-logo .logo-sub{font-size:12px;color:var(--text-3);}
.login-field{display:flex;flex-direction:column;gap:8px;}
.login-field label{font-size:11.5px;color:var(--text-2);font-weight:500;}
.login-field .inputwrap{min-height:48px;}
.login-field .inputwrap input{font-size:16px;}
.login-btn{width:100%;min-height:48px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;-webkit-appearance:none;appearance:none;transition:opacity .15s;}
.login-btn:active{opacity:.8;}
.login-btn:disabled{opacity:.5;cursor:default;}
.login-err{font-size:12.5px;color:var(--neg);text-align:center;background:var(--neg-bg);border-radius:var(--r-sm);padding:8px 12px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* === EMBEDDED MODE (ERP iframe) === */
const IS_EMBEDDED = new URLSearchParams(window.location.search).get('embedded') === '1';
const SUPABASE_URL  = 'https://hrcuwviuqzgfqpdjtqcw.supabase.co';
const SUPABASE_ANON = 'sb_publishable_CPRxITDk9Hu8cV3YCi0Plw_z65FqtRx';

// Supabase client — init lazily on sh-session message from ERP shell
let _sbCmp = null;
if (IS_EMBEDDED) {
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'sh-session' && e.data.access_token) {
      _sbCmp = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: { persistSession: false }
      });
      _sbCmp.auth.setSession({
        access_token: e.data.access_token,
        refresh_token: e.data.refresh_token
      }).then(() => {
        window.dispatchEvent(new CustomEvent('cp-sb-ready'));
      });
    }
  });
}

/* === AUTH === */
const PWD_HASH = '68a04e7a0ab471b4b419cebdf06a895bb7e0f66b2a4d0ac445f08194ab9d6627';
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function useAuth() {
  const [authed, setAuthed] = useState(() => {
    if (IS_EMBEDDED) return true; // ERP shell already authenticated
    try { return sessionStorage.getItem('cp_auth')==='ok'; } catch(e){ return false; }
  });
  const login = async (pwd) => { const h = await sha256(pwd); if(h===PWD_HASH){ try{sessionStorage.setItem('cp_auth','ok');}catch(e){} setAuthed(true); return true; } return false; };
  return { authed, login };
}
function LoginScreen({ onLogin }) {
  const [pwd, setPwd] = useState(''); const [err, setErr] = useState(false); const [loading, setLoading] = useState(false); const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);
  const submit = async (e) => { e.preventDefault(); if(!pwd||loading) return; setLoading(true); setErr(false); const ok = await onLogin(pwd); if(!ok){setErr(true);setPwd('');setLoading(false);inputRef.current?.focus();} };
  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-logo"><div className="logo-icon">¥฿</div><div className="logo-title">ต้นทุนนำเข้า</div><div className="logo-sub">Landed-cost calculator · จีน→ไทย</div></div>
        <div className="login-field">
          <label htmlFor="pwd-input">รหัสผ่าน</label>
          <div className="inputwrap"><input id="pwd-input" ref={inputRef} type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setErr(false);}} placeholder="กรอกรหัสผ่าน" autoComplete="current-password" /></div>
        </div>
        {err && <div className="login-err">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</div>}
        <button className="login-btn" type="submit" disabled={loading||!pwd}>{loading?'กำลังตรวจสอบ…':'เข้าสู่ระบบ'}</button>
      </form>
    </div>
  );
}

/* === HELPERS === */
const fmt = (n,d=2) => (isFinite(n)?n:0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const THB = (n,d=2) => '฿'+fmt(n,d);
const CNY = (n,d=2) => '¥'+fmt(n,d);
const CCY_SYM   = {cny:'¥', usd:'$', eur:'€', thb:'฿'};
const CCY_LABEL = {cny:'CNY', usd:'USD', eur:'EUR', thb:'THB'};
function CurrencyChips({value, onChange}) {
  return (
    <div className="ccy-chips">
      {Object.keys(CCY_SYM).map(code => (
        <button key={code} className={value===code?'active':''} onClick={()=>onChange(code)}>
          {CCY_SYM[code]} {CCY_LABEL[code]}
        </button>
      ))}
    </div>
  );
}
const INT = (n) => (isFinite(n)?n:0).toLocaleString('en-US');
let _id = 100; const uid = () => ++_id;
const loadLS = (k,def) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } };
const saveLS = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

/* === ICONS === */
const IconPlus = () => <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;
const IconX = () => <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>;
const IconUp = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 11V3M3.5 6.5L7 3l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IconDown = () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 3v8M3.5 7.5L7 11l3.5-3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IconList = () => <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>;
const IconSave = () => <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 3h10a2 2 0 0 1 2 2v12a1 1 0 0 1-1.55.83L10 15.2l-5.45 2.63A1 1 0 0 1 3 17V5a2 2 0 0 1 2-2z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>;
const IconBack = () => <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M13 4L6 10l7 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IconPhoto = () => <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="13" rx="2" stroke="currentColor" strokeWidth="1.3"/><circle cx="10" cy="10.5" r="3" stroke="currentColor" strokeWidth="1.3"/><path d="M7 4l1-2h4l1 2" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>;

/* === IMAGE THUMB === */
function ImageThumb({ url, size, onChangeUrl }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(url || '');
  const [err, setErr] = useState(false);
  const inputRef = useRef(null);
  const wrapRef = useRef(null);

  useEffect(() => { setDraft(url || ''); setErr(false); }, [url]);

  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (!wrapRef.current?.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const toggle = (e) => {
    e.stopPropagation();
    if (!open) { setDraft(url || ''); setErr(false); setTimeout(() => inputRef.current?.focus(), 50); }
    setOpen(o => !o);
  };
  const commit = () => { onChangeUrl(draft); setOpen(false); };
  const clear = (e) => { e.stopPropagation(); setDraft(''); onChangeUrl(''); setOpen(false); setErr(false); };

  return (
    <div ref={wrapRef} style={{position:'relative',flexShrink:0}}>
      <div className="imgthumb" style={{width:size,height:size}} onClick={toggle} title="เพิ่มรูปภาพ">
        {url && !err
          ? <img src={url} alt="" onError={() => setErr(true)} />
          : <span className="it-icon"><IconPhoto /></span>
        }
      </div>
      {open && (
        <div className="imgpop">
          <input ref={inputRef} value={draft} placeholder="วาง URL รูปภาพ..."
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => { if(e.key==='Enter') commit(); if(e.key==='Escape') setOpen(false); }} />
          {draft && <button className="imgpop-del" onClick={clear}>✕</button>}
          <button className="imgpop-ok" onClick={commit}>ตกลง</button>
        </div>
      )}
    </div>
  );
}

/* === CALC ENGINE === */
function computeForward(cny, qty, rate, fees, sell) {
  const goods = cny * rate * qty;
  let fixedTotal=0, pctRate=0;
  fees.forEach(f => { const a=parseFloat(f.amount)||0; if(f.type==='percent') pctRate+=a; else fixedTotal+=a; });
  const pctTotal = goods*(pctRate/100);
  const total = goods+fixedTotal+pctTotal;
  const perUnit = qty ? total/qty : 0;
  const lines = [{label:'ค่าสินค้า', val:goods, mode:'goods'}];
  fees.forEach(f => { const a=parseFloat(f.amount)||0; const v=f.type==='percent'?goods*(a/100):a; lines.push({label:f.name||'ค่าธรรมเนียม',val:v,pct:f.type==='percent'?a:null,mode:'add'}); });
  lines.push({label:'ต้นทุนรวม/ชิ้น', val:qty?total/qty:0, mode:'total'});
  const s=parseFloat(sell)||0, revenue=s*qty, profit=revenue-total;
  const margin=revenue?(profit/revenue)*100:0, markup=total?(profit/total)*100:0;
  return {goods,total,perUnit,lines,hasSell:s>0,revenue,profit,margin,markup,profitUnit:qty?profit/qty:0,qty};
}
function computeCompetitor(packPrice, packQty, marginPct, rate, fees) {
  const unitSell=packQty?packPrice/packQty:0, m=marginPct||0, unitCost=unitSell/(1+m/100);
  let fixedTotal=0, pctRate=0;
  fees.forEach(f => { const a=parseFloat(f.amount)||0; if(f.type==='percent') pctRate+=a; else fixedTotal+=a; });
  const fixedPerUnit=packQty?fixedTotal/packQty:0;
  const goodsThb=(unitCost-fixedPerUnit)/(1+pctRate/100);
  const cny=rate?goodsThb/rate:0;
  const lines=[{label:'ราคาขาย/ชิ้น',val:unitSell,mode:'sell'}];
  if(m>0) lines.push({label:`กำไร (${m}%)`,val:unitSell-unitCost,mode:'deduct'});
  fees.forEach(f=>{const a=parseFloat(f.amount)||0;const v=f.type==='percent'?goodsThb*(a/100):(packQty?a/packQty:0);if(a>0)lines.push({label:f.name||'ค่าธรรมเนียม',val:v,pct:f.type==='percent'?a:null,mode:'deduct'});});
  lines.push({label:'ต้นทุนสินค้า',val:goodsThb,mode:'total'});
  return {unitSell,unitCost,fixedPerUnit,pctRate,goodsThb,cny,packPrice,packQty,marginPct:m,valid:goodsThb>0,lines};
}
function computeAllSuppliers(suppliers, qty, rates, fees) {
  const q = parseFloat(qty)||1;
  const results = suppliers.map(s => {
    const uc = s.unitType==='pack' ? (parseFloat(s.packCny)||0)/(parseFloat(s.packUnits)||1) : (parseFloat(s.unitCny)||0);
    if (uc<=0) return null;
    const r = computeForward(uc, q, (rates[s.currency||'cny']||rates.cny), fees, '');
    return {supplierId:s.id, name:s.name||'ร้านไม่มีชื่อ', effectiveUnitCny:uc, perUnit:r.perUnit, total:r.total, lines:r.lines, rank:0, isBest:false};
  }).filter(Boolean);
  results.sort((a,b)=>a.perUnit-b.perUnit);
  results.forEach((r,i)=>{r.rank=i+1;r.isBest=i===0;});
  return results;
}
function computeAllCompetitors(competitors, rates, fees) {
  const results = competitors.map(c => {
    const pp=parseFloat(c.packPrice)||0, pq=parseFloat(c.packQty)||0;
    if(pp<=0||pq<=0) return null;
    const ppThb = pp * ((rates[c.currency||'thb'])||1); // convert to THB
    const comp = computeCompetitor(ppThb, pq, parseFloat(c.compMargin)||0, rates.cny, fees);
    if(!comp.valid) return null;
    return {compId:c.id, name:c.name||'ร้านไม่มีชื่อ', unitSell:comp.unitSell, unitCost:comp.unitCost, cny:comp.cny, goodsThb:comp.goodsThb, lines:comp.lines, rank:0, isBest:false};
  }).filter(Boolean);
  results.sort((a,b)=>a.cny-b.cny);
  results.forEach((r,i)=>{r.rank=i+1;r.isBest=i===0;});
  return results;
}

/* === EXCHANGE RATE HOOK === */
function useExchangeRate() {
  const initRates = () => {
    try {
      const cny = parseFloat(localStorage.getItem('cny_thb_rate')||'4.92');
      const usd = parseFloat(localStorage.getItem('usd_thb_rate')||'33.5');
      const eur = parseFloat(localStorage.getItem('eur_thb_rate')||'36.5');
      return {cny, usd, eur, thb:1};
    } catch(e) { return {cny:4.92, usd:33.5, eur:36.5, thb:1}; }
  };
  const [rates, setRates] = useState(initRates);
  const [info, setInfo] = useState({time:null,delta:null,live:false,loading:true});
  const doFetch = useCallback(async () => {
    setInfo(p => ({...p,loading:true}));
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      const d = await res.json();
      if (d.result==='success' && d.rates?.THB && d.rates?.CNY) {
        const thb=d.rates.THB, cny=thb/d.rates.CNY, eur=thb/(d.rates.EUR||1);
        const nr=cny; let delta=null;
        try {
          const prev=parseFloat(localStorage.getItem('cny_thb_prev')||'0');
          if(prev>0) delta=(nr-prev)/prev*100;
          localStorage.setItem('cny_thb_prev', localStorage.getItem('cny_thb_rate')||String(nr));
          localStorage.setItem('cny_thb_rate', String(nr));
          localStorage.setItem('usd_thb_rate', String(thb));
          localStorage.setItem('eur_thb_rate', String(eur));
        } catch(e){}
        const bkk=new Date((d.time_last_update_unix*1000)+7*3600000);
        const hh=String(bkk.getUTCHours()).padStart(2,'0'), mm=String(bkk.getUTCMinutes()).padStart(2,'0');
        setRates({cny:nr, usd:thb, eur, thb:1});
        setInfo({time:`${hh}:${mm}`,delta,live:true,loading:false});
      }
    } catch(e) { setInfo(p => ({...p,live:false,loading:false})); }
  }, []);
  useEffect(() => { doFetch(); const id=setInterval(doFetch,10*60*1000); return ()=>clearInterval(id); }, [doFetch]);
  return {rates, rate:rates.cny, info, refresh:doFetch};
}

/* === COMPARE RESULT (forward) === */
function CompareResult({results, qty, sell, fees, rate}) {
  const q = parseFloat(qty)||1;
  const best = results[0];
  const worst = results[results.length-1];
  const s = parseFloat(sell)||0;
  const hasSell = s > 0 && best;
  const profit = hasSell ? s - best.perUnit : 0;
  const margin = hasSell && s ? (profit/s)*100 : 0;
  const pos = profit >= 0;
  if (results.length === 0) {
    return (
      <div className="cmp-result">
        <div className="cmp-kicker">ต้นทุนรวมเมื่อถึงไทย</div>
        <div className="cmp-empty">กรอกราคาแต่ละร้านด้านบน<br/>จะเรียงจากถูกสุดอัตโนมัติ</div>
      </div>
    );
  }
  return (
    <div className="cmp-result">
      <div className="cmp-kicker">ต้นทุนรวมถึงไทย · {INT(q)} ชิ้น</div>
      <div className="cmp-table">
        {results.map(r => {
          const diffPct = r.isBest ? 0 : ((r.perUnit - best.perUnit)/best.perUnit)*100;
          const diffBaht = r.perUnit - best.perUnit;
          return (
            <div key={r.supplierId} className={`cmp-item${r.isBest?' best':''}`}>
              <div className="cmp-rank">{r.rank}</div>
              <div className="cmp-name">{r.name}</div>
              <div className="cmp-vals">
                <span className="cmp-unit num">{THB(r.perUnit)}<span style={{fontSize:'12px',fontWeight:400,color:'var(--text-3)'}}>/ชิ้น</span></span>
                {r.isBest
                  ? <span className="cmp-diff">ถูกสุด ✓</span>
                  : <span className="cmp-diff num">+{fmt(diffPct,1)}% · {THB(diffBaht)}</span>
                }
                {q > 1 && <span className="cmp-sub num">รวม {THB(r.total,0)}</span>}
              </div>
            </div>
          );
        })}
      </div>
      {results.length >= 2 && (
        <div className="cmp-note">
          ซื้อจาก <b style={{fontWeight:500,color:'var(--text)'}}>{best.name}</b> ประหยัดกว่า{' '}
          <b style={{fontWeight:500,color:'var(--text)'}}>{worst.name}</b>{' '}
          <span className="num" style={{color:'var(--pos)',fontWeight:500}}>{THB(worst.perUnit-best.perUnit)}/ชิ้น</span>
          {q>1 && <span className="num"> · รวม {THB((worst.perUnit-best.perUnit)*q,0)}</span>}
        </div>
      )}
      {hasSell && (
        <div className="margin-section">
          <div className="margin-head">
            <span className="mh">กำไรขั้นต้น — ซื้อจาก {best.name}</span>
            <span className={`badge ${pos?'pos':'neg'}`}>{pos?<IconUp/>:<IconDown/>}{(pos?'+':'')+fmt(margin,1)+'%'}</span>
          </div>
          <div className="mstats">
            <div className="mstat"><span className="ml">กำไร / ชิ้น</span><span className={`mv num ${pos?'pos':'neg'}`}>{(pos?'+':'−')+THB(Math.abs(profit))}</span></div>
            <div className="mstat"><span className="ml">กำไรรวม</span><span className={`mv num ${pos?'pos':'neg'}`}>{(pos?'+':'−')+THB(Math.abs(profit*q),0)}</span></div>
            <div className="mstat"><span className="ml">ต้นทุน / ชิ้น</span><span className="mv num">{THB(best.perUnit)}</span></div>
            <div className="mstat"><span className="ml">ราคาขาย / ชิ้น</span><span className="mv num">{THB(s)}</span></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* === INVESTMENT SUMMARY === */
function InvestmentSummary({ cmpResults, revResults, qty, sell }) {
  if (!cmpResults.length) return null;
  const best = cmpResults[0];
  const q = parseFloat(qty) || 1;
  const s = parseFloat(sell) || 0;
  const hasSell = s > 0;
  const costPerUnit = best.perUnit;
  const investment = best.total;
  const profitUnit = hasSell ? s - costPerUnit : 0;
  const totalProfit = hasSell ? profitUnit * q : 0;
  const roi = hasSell && investment > 0 ? (totalProfit / investment) * 100 : null;
  const margin = hasSell && s > 0 ? (profitUnit / s) * 100 : null;

  const bestComp = revResults[0];
  let compDiff = null;
  if (bestComp && costPerUnit > 0 && bestComp.unitCost > 0) {
    compDiff = ((bestComp.unitCost - costPerUnit) / bestComp.unitCost) * 100;
  }

  let vc = 'neutral', vl, vd;
  if (hasSell) {
    const m = margin || 0;
    if (m > 30) {
      vc = 'pos'; vl = 'น่าลงทุนมาก';
      vd = `กำไร ${fmt(m,1)}%${compDiff !== null ? (compDiff >= 0 ? ` · ถูกกว่าคู่แข่ง ${fmt(compDiff,1)}%` : ` · แพงกว่าคู่แข่ง ${fmt(Math.abs(compDiff),1)}%`) : ''}`;
    } else if (m > 15) {
      vc = 'pos'; vl = 'น่าลงทุน';
      vd = `กำไร ${fmt(m,1)}%${compDiff !== null && compDiff < 0 ? ` · แพงกว่าคู่แข่ง ${fmt(Math.abs(compDiff),1)}%` : ''}`;
    } else if (m > 0) {
      vc = 'warn'; vl = 'พอใช้ได้';
      vd = `กำไรต่ำ ${fmt(m,1)}% — ระวังต้นทุนที่ซ่อนอยู่`;
    } else {
      vc = 'neg'; vl = 'ขาดทุน';
      vd = `ราคาขายต่ำกว่าต้นทุน ${THB(Math.abs(profitUnit))}/ชิ้น`;
    }
  } else if (compDiff !== null) {
    if (compDiff >= 0) { vc = 'pos'; vl = 'ต้นทุนดี'; vd = `ถูกกว่าคู่แข่ง ${fmt(compDiff,1)}% — ใส่ราคาขายเพื่อดู ROI`; }
    else { vc = 'neg'; vl = 'ต้นทุนสูง'; vd = `แพงกว่าคู่แข่ง ${fmt(Math.abs(compDiff),1)}% — ยากที่จะแข่งได้`; }
  } else {
    vl = 'ใส่ราคาขาย'; vd = 'เพื่อดู ROI — หรือใส่ราคาคู่แข่งเพื่อเปรียบเทียบต้นทุน';
  }

  return (
    <div className="invest-card">
      <div className="invest-title">สรุปการลงทุน</div>
      <div className={`invest-verdict ${vc}`}>
        <span className="iv-label">{vl}</span>
        <span className="iv-detail">{vd}</span>
      </div>
      <div className="invest-stats">
        <div className="istat"><span className="is-label">เงินลงทุน</span><span className="is-val num">{THB(investment,0)}</span><span className="is-sub">{INT(q)} ชิ้น</span></div>
        <div className="istat"><span className="is-label">ต้นทุน/ชิ้น</span><span className="is-val num">{THB(costPerUnit)}</span><span className="is-sub">{best.name}</span></div>
        {hasSell && <>
          <div className="istat"><span className="is-label">กำไร/ชิ้น</span><span className={`is-val num ${profitUnit>=0?'pos':'neg'}`}>{profitUnit>=0?'+':''}{THB(profitUnit)}</span><span className="is-sub">ขาย {THB(s)}/ชิ้น</span></div>
          <div className="istat"><span className="is-label">ROI</span><span className={`is-val num ${(roi||0)>=0?'pos':'neg'}`}>{(roi||0)>=0?'+':''}{fmt(roi||0,1)}%</span><span className="is-sub">กำไรรวม {THB(totalProfit,0)}</span></div>
        </>}
      </div>
      <div className="invest-row"><span className="ir-dot"></span><span>ราคาขายขั้นต่ำ (ไม่ขาดทุน) — <strong className="num">{THB(costPerUnit)}/ชิ้น</strong></span></div>
      {compDiff !== null && (
        <div className={`invest-comp ${compDiff>=0?'pos':'neg'}`}>
          เทียบ <strong>{bestComp.name}</strong>:{' '}
          {compDiff >= 0
            ? <span>เราถูกกว่า <strong>{fmt(compDiff,1)}%</strong></span>
            : <span>เราแพงกว่า <strong>{fmt(Math.abs(compDiff),1)}%</strong></span>
          }
          {' '}· ต้นทุนเขา <strong className="num">{THB(bestComp.unitCost)}/ชิ้น</strong>
        </div>
      )}
    </div>
  );
}

/* === PRODUCT LIST === */
function ProductCard({p, onLoad, onDelete}) {
  const [imgErr, setImgErr] = useState(false);
  const isRev = p.mode==='rev';
  const d = new Date(p.savedAt);
  const ds = `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`;
  const preview = isRev
    ? (p.preview?.cny > 0 ? `≈ ${CNY(p.preview.cny)}/ชิ้น` : '—')
    : (p.preview?.perUnit > 0 ? `${THB(p.preview.perUnit)}/ชิ้น` : '—');
  const count = isRev
    ? (p.inputs?.competitors?.length || 0)
    : (p.inputs?.suppliers?.length || 0);
  const tag = isRev
    ? (count > 1 ? `${count} คู่แข่ง` : 'คู่แข่ง')
    : (count > 1 ? `${count} ร้าน` : 'นำเข้า');
  return (
    <div className="pcard">
      <div className="imgthumb" style={{width:44,height:44,borderRadius:9,cursor:'pointer',flexShrink:0}} onClick={onLoad}>
        {p.image_url && !imgErr
          ? <img src={p.image_url} alt="" onError={()=>setImgErr(true)} style={{width:'100%',height:'100%',objectFit:'cover'}} />
          : <span className="it-icon"><IconPhoto /></span>
        }
      </div>
      <div className="pcard-body" onClick={onLoad}>
        <div className="pcard-name">{p.name}</div>
        <div className="pcard-meta">
          <span className={`pcard-tag${isRev?' rev':''}`}>{tag}</span>
          <span className="pcard-val">{preview}</span>
          <span>{ds}</span>
        </div>
      </div>
      <button className="delbtn" onClick={onDelete} aria-label="ลบ"><IconX /></button>
    </div>
  );
}
function ProductList({products, onLoad, onDelete, onBack}) {
  const sorted = [...products].reverse();
  return (
    <div className="app">
      <div className="appbar">
        <button className="iconbtn" onClick={onBack} aria-label="กลับ"><IconBack /></button>
        <div className="title">รายการสินค้า<small>{products.length} รายการที่บันทึก</small></div>
        <div style={{width:'38px'}}></div>
      </div>
      {sorted.length === 0
        ? <div className="list-empty"><div className="le-icon">📦</div><div>ยังไม่มีสินค้าที่บันทึก<br/><span style={{fontSize:'12px'}}>กลับไปกรอกข้อมูล → ใส่ชื่อสินค้า → กดบันทึก</span></div></div>
        : sorted.map(p => <ProductCard key={p.id} p={p} onLoad={()=>onLoad(p)} onDelete={()=>onDelete(p.id)} />)
      }
    </div>
  );
}

/* === DEFAULTS === */

  try { return parseFloat(localStorage.getItem('ss_tiktok_commission_pct')) || 20; } catch(e) { return 20; }
};
const getHardcodedFees = () => [
  {name:'ค่าโอนต่างประเทศ',   amount:'2',                              type:'fixed'},
  {name:'ค่านำเข้า',          amount:'20',                             type:'percent'},
  {name:'คนขนส่งในประเทศ',    amount:'0',                              type:'fixed'},
  {name:'ค่าขนส่งต่างประเทศ', amount:'0',                              type:'fixed'},
  {name:'ค่าพนักงาน',         amount:'5',                              type:'percent'},
  {name:'ค่าคอมแพลตฟอร์ม',   amount:String(getTiktokCommissionPct()), type:'percent'},
  {name:'ค่า Ads',            amount:'5',                              type:'percent'},
];
const loadDefaultFees = () => {
  try {
    const saved = localStorage.getItem('cp_default_fees');
    const base = saved ? JSON.parse(saved) : getHardcodedFees();
    return base.map(f => ({...f, id:uid()}));
  } catch(e) {
    return getHardcodedFees().map(f => ({...f, id:uid()}));
  }
};
const demoFees = () => loadDefaultFees();
const newSupplier = () => ({id:uid(), name:'', unitType:'unit', currency:'cny', unitCny:'', packCny:'', packUnits:'100', link:'', contact:'', image_url:''});
const newCompetitor = () => ({id:uid(), name:'', currency:'thb', packPrice:'', packQty:'100', compMargin:'', link:'', contact:'', image_url:''});
const demoSuppliers = () => ([
  {id:uid(), name:'ร้าน A', unitType:'unit', currency:'cny', unitCny:'4.50', packCny:'',    packUnits:'100',  link:'', contact:'', image_url:''},
  {id:uid(), name:'ร้าน B', unitType:'pack', currency:'cny', unitCny:'',     packCny:'350', packUnits:'100',  link:'', contact:'', image_url:''},
  {id:uid(), name:'ร้าน C', unitType:'pack', currency:'cny', unitCny:'',     packCny:'2800',packUnits:'1000', link:'', contact:'', image_url:''},
]);
const demoCompetitors = () => ([
  {id:uid(), name:'คู่แข่ง A', currency:'thb', packPrice:'32000', packQty:'100', compMargin:'30', link:'', contact:'', image_url:''},
  {id:uid(), name:'คู่แข่ง B', currency:'thb', packPrice:'28000', packQty:'100', compMargin:'25', link:'', contact:'', image_url:''},
]);

/* === MAIN === */
function DefaultFeesEditor() {
  const [fees, setFees] = useState(loadDefaultFees);
  const [flash, setFlash] = useState(false);
  const updFee = (id,nf) => setFees(fees.map(f=>f.id===id?nf:f));
  const delFee = (id) => setFees(fees.filter(f=>f.id!==id));
  const addFee = () => setFees([...fees,{id:uid(),name:'',amount:'',type:'fixed'}]);
  const save = () => {
    saveLS('cp_default_fees', fees.map(({id,...f})=>f));
    setFlash(true); setTimeout(()=>setFlash(false), 1500);
  };
  return (
    <div style={{padding:'16px 16px 100px'}}>
      <div style={{fontSize:12,color:'var(--text-3)',marginBottom:12,lineHeight:1.6}}>
        ค่าธรรมเนียมชุดนี้จะถูกโหลดเมื่อกด ↺ มาตรฐาน หรือสร้างสินค้าใหม่
      </div>
      {fees.map(f => (
        <FeeRow key={f.id} fee={f}
          onChange={nf=>updFee(f.id,nf)}
          onDelete={()=>delFee(f.id)} />
      ))}
      <button className="addfee" onClick={addFee}><IconPlus /> เพิ่มค่าธรรมเนียม</button>
      <button className={`fab-save${flash?' flash':''}`} onClick={save}>
        <IconSave />{flash?'บันทึกแล้ว ✓':'บันทึกเป็นมาตรฐาน'}
      </button>
    </div>
  );
}

function Main() {
  const {rates, rate, info, refresh} = useExchangeRate();
  const [screen, setScreen] = useState('calc');
  const [tab, setTab] = useState('calc');
  const [products, setProducts] = useState(() => IS_EMBEDDED ? [] : loadLS('cp_products', []));
  const [productName, setProductName] = useState('');
  const [productId, setProductId] = useState(null);
  const [productImage, setProductImage] = useState('');
  const [savedFlash, setSavedFlash] = useState(false);
  const nameRef = useRef(null);

  // Supabase load/save (embedded mode only)
  const loadFromDB = useCallback(async () => {
    if (!_sbCmp) return;
    const { data } = await _sbCmp.from('compare_products')
      .select('*').order('updated_at', { ascending: false });
    if (data) setProducts(data.map(r => ({ ...r, savedAt: new Date(r.updated_at).getTime() })));
  }, []);

  const rtChannelRef = useRef(null);

  useEffect(() => {
    if (!IS_EMBEDDED) return;
    const handler = () => {
      loadFromDB();
      // Realtime subscription — sync across devices instantly
      if (rtChannelRef.current) _sbCmp.removeChannel(rtChannelRef.current);
      rtChannelRef.current = _sbCmp
        .channel('compare_products_rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'compare_products' },
          () => loadFromDB()
        )
        .subscribe();
    };
    window.addEventListener('cp-sb-ready', handler);
    return () => {
      window.removeEventListener('cp-sb-ready', handler);
      if (rtChannelRef.current && _sbCmp) _sbCmp.removeChannel(rtChannelRef.current);
    };
  }, [loadFromDB]);

  const [mode, setMode] = useState('fwd');
  const [fees, setFees] = useState(demoFees);
  /* forward */
  const [suppliers, setSuppliers] = useState(demoSuppliers);
  const [qty, setQty] = useState('100');
  const [sell, setSell] = useState('');
  const [sellMode, setSellMode] = useState('pack');
  const [sellPackPrice, setSellPackPrice] = useState('');
  const [sellPackQty, setSellPackQty] = useState('100');
  /* reverse */
  const [competitors, setCompetitors] = useState(demoCompetitors);

  /* derived */
  const cmpResults = computeAllSuppliers(suppliers, qty, rates, fees);
  const revResults = computeAllCompetitors(competitors, rates, fees);
  const rankById = Object.fromEntries(cmpResults.map(r => [r.supplierId, r.rank]));
  const revRankById = Object.fromEntries(revResults.map(r => [r.compId, r.rank]));
  const costById = Object.fromEntries(cmpResults.map(r => [r.supplierId, {perUnit:r.perUnit, total:r.total, lines:r.lines}]));
  const revCostById = Object.fromEntries(revResults.map(r => [r.compId, {goodsThb:r.goodsThb, cny:r.cny, lines:r.lines}]));
  const _spq = parseFloat(sellPackQty)||0;
  const _spp = parseFloat(sellPackPrice)||0;
  const effectiveSell = sellMode==='pack' ? (_spq>0 && _spp>0 ? String(_spp/_spq) : '') : sell;

  const updFee = (id,nf) => setFees(fees.map(f=>f.id===id?nf:f));
  const delFee = (id) => setFees(fees.filter(f=>f.id!==id));
  const addFee = () => setFees([...fees, {id:uid(),name:'',amount:'',type:'fixed'}]);

  const saveProduct = () => {
    const name = productName.trim();
    if (!name) { nameRef.current?.focus(); nameRef.current?.select(); return; }
    const id = productId || (IS_EMBEDDED ? crypto.randomUUID() : String(uid()));
    const preview = {
      perUnit: cmpResults[0]?.perUnit||0,
      total:   cmpResults[0]?.total||0,
      cny:     revResults[0]?.cny||0,
      goodsThb:revResults[0]?.goodsThb||0,
    };
    const record = {
      id, name, mode,
      inputs: {
        suppliers: suppliers.map(s=>({...s})),
        qty, sell, sellMode, sellPackPrice, sellPackQty,
        competitors: competitors.map(c=>({...c})),
      },
      fees: fees.map(f=>({...f})),
      preview,
      image_url: productImage,
      savedAt: Date.now(),
    };
    const next = productId ? products.map(p=>p.id===productId?record:p) : [...products, record];
    setProducts(next); setProductId(id);
    if (IS_EMBEDDED && _sbCmp) {
      _sbCmp.from('compare_products').upsert({
        id, name, mode,
        inputs: record.inputs,
        fees: record.fees,
        preview: record.preview,
        image_url: productImage,
      }).then(({ error }) => {
        if (error) console.error('[compare] upsert error:', error.message);
      });
    } else {
      saveLS('cp_products', next);
    }
    setSavedFlash(true); setTimeout(()=>setSavedFlash(false), 1500);
  };

  const loadProduct = (p) => {
    setProductName(p.name); setProductId(p.id); setProductImage(p.image_url || '');
    const m = p.mode==='cmp'?'fwd':p.mode;
    setMode(m);
    setFees(p.fees.map(f=>({...f,id:uid()})));
    // Always load suppliers — fix: desktop saves both sides regardless of mode
    if (Array.isArray(p.inputs.suppliers) && p.inputs.suppliers.length > 0) {
      setSuppliers(p.inputs.suppliers.map(s=>({...s,id:uid()})));
    } else if (p.inputs.cny) {
      setSuppliers([{id:uid(), name:'ร้านค้า', unitType:p.inputs.isPack?'pack':'unit', unitCny:p.inputs.cny||'0', packCny:p.inputs.packCny||'', packUnits:p.inputs.packUnits||'100', link:'', contact:'', image_url:''}]);
    } else {
      setSuppliers(demoSuppliers());
    }
    setQty(p.inputs.qty||p.inputs.cmpQty||'100');
    setSell(p.inputs.sell||'');
    setSellMode(p.inputs.sellMode||'pack');
    setSellPackPrice(p.inputs.sellPackPrice||'');
    setSellPackQty(p.inputs.sellPackQty||'100');
    // Always load competitors — fix: same reason
    if (Array.isArray(p.inputs.competitors) && p.inputs.competitors.length > 0) {
      setCompetitors(p.inputs.competitors.map(c=>({...c,id:uid()})));
    } else if (p.inputs.packPrice) {
      setCompetitors([{id:uid(), name:'คู่แข่ง', packPrice:p.inputs.packPrice||'0', packQty:p.inputs.packQty||'100', compMargin:p.inputs.compMargin||'0', link:'', contact:'', image_url:''}]);
    } else {
      setCompetitors(demoCompetitors());
    }
    setScreen('calc');
  };

  const deleteProduct = (id) => {
    const next = products.filter(p=>p.id!==id);
    setProducts(next);
    if (IS_EMBEDDED && _sbCmp) {
      _sbCmp.from('compare_products').delete().eq('id', id).then();
    } else {
      saveLS('cp_products', next);
    }
    if (productId===id) setProductId(null);
  };

  const newProduct = () => {
    setProductName(''); setProductId(null); setMode('fwd'); setProductImage('');
    setFees(demoFees()); setSuppliers(demoSuppliers()); setQty('100'); setSell('');
    setSellMode('pack'); setSellPackPrice(''); setSellPackQty('100');
    setCompetitors(demoCompetitors());
  };

  if (screen==='list') return <ProductList products={products} onLoad={loadProduct} onDelete={deleteProduct} onBack={()=>setScreen('calc')} />;

  return (
    <div className="app">
      <div className="appbar">
        <button className="iconbtn" onClick={()=>setScreen('list')} aria-label="รายการ"><IconList /></button>
        <div className="title">นำเข้าจากจีน<small>Landed-cost calculator</small></div>
        <div style={{width:'38px'}}></div>
      </div>
      <div className="subtab-bar">
        <button className={tab==='calc'?'active':''} onClick={()=>setTab('calc')}>คำนวณ</button>
        <button className={tab==='fees'?'active':''} onClick={()=>setTab('fees')}>ค่าธรรมเนียมมาตรฐาน</button>
      </div>

      <div className="name-row">
        <ImageThumb url={productImage} size={40} onChangeUrl={setProductImage} />
        <input ref={nameRef} className="name-input" value={productName}
          onChange={e=>setProductName(e.target.value)}
          placeholder="ชื่อสินค้า (ใส่แล้วกดบันทึก ด้านล่างขวา)"
          onKeyDown={e=>e.key==='Enter'&&saveProduct()} />
        {savedFlash && <span className="name-saved">✓ บันทึกแล้ว</span>}
        {!savedFlash && productId && <button className="name-new-btn" onClick={newProduct}>+ ใหม่</button>}
      </div>

      <RateBar rate={rate} info={info} onRefresh={refresh} />

      {tab==='fees' ? <DefaultFeesEditor /> : <>
      {/* Mobile only: mode toggle */}
      <div className="mobile-only"><ModeToggle mode={mode} onMode={setMode} /></div>

      <div className="dual-col">
        {/* ── LEFT: จีน → ไทย ── */}
        <div className={mode!=='fwd'?'mobile-hidden':''}>
          <div className="col-hd desktop-only">ราคาจีน <span style={{color:'var(--accent)'}}>→</span> ไทย</div>
          <div className="qty-bar">
            <span className="qty-bar-label">จำนวนที่ซื้อ</span>
            <div className="qty-bar-input">
              <input inputMode="decimal" value={qty} placeholder="100"
                onChange={e=>setQty(e.target.value.replace(/[^0-9.]/g,''))} />
              <span className="qs">ชิ้น</span>
            </div>
          </div>
          <div className="sup-col-grid" style={{gridTemplateColumns:`repeat(${suppliers.length},1fr)`}}>
            {suppliers.map(s => (
              <SupplierRow key={s.id} s={s}
                cmpRank={rankById[s.id]||0}
                cmpCost={costById[s.id]||null}
                onChange={ns=>setSuppliers(prev=>prev.map(x=>x.id===s.id?ns:x))}
                onDelete={()=>setSuppliers(prev=>prev.filter(x=>x.id!==s.id))}
              />
            ))}
          </div>
          <button className="addrow-btn" onClick={()=>setSuppliers(prev=>[...prev,newSupplier()])}><IconPlus /> เพิ่มร้านค้า</button>
          <div className="card" style={{marginTop:'14px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,gap:8}}>
              <span className="fl" style={{marginBottom:0}}>ราคาขายในไทย — ดูกำไร (ไม่บังคับ)</span>
              <div className="mode-chips">
                <button className={sellMode==='unit'?'active':''} onClick={()=>setSellMode('unit')}>ต่อชิ้น</button>
                <button className={sellMode==='pack'?'active':''} onClick={()=>setSellMode('pack')}>ยกแพค</button>
              </div>
            </div>
            {sellMode==='unit' ? (
              <div className="field" style={{marginBottom:0}}>
                <NumInput value={sell} onChange={setSell} prefix="฿" suffix="/ชิ้น" />
              </div>
            ) : (
              <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                <div className="field" style={{flex:1,marginBottom:0}}>
                  <span className="fl">ราคา / ลัง (฿)</span>
                  <NumInput value={sellPackPrice} onChange={setSellPackPrice} prefix="฿" suffix="" />
                </div>
                <div className="field" style={{width:95,marginBottom:0}}>
                  <span className="fl">ชิ้น / ลัง</span>
                  <NumInput value={sellPackQty} onChange={setSellPackQty} prefix="" suffix="ชิ้น" />
                </div>
              </div>
            )}
            {sellMode==='pack' && _spp>0 && _spq>0 && (
              <div className="sup-derived" style={{marginTop:6}}>= ฿{fmt(_spp/_spq,2)}/ชิ้น</div>
            )}
          </div>
          <CompareResult results={cmpResults} qty={qty} sell={effectiveSell} fees={fees} rate={rate} />
        </div>

        {/* ── RIGHT: ไทย → จีน ── */}
        <div className={mode!=='rev'?'mobile-hidden':''}>
          <div className="col-hd desktop-only">ราคาไทย <span style={{color:'var(--text-3)'}}>→</span> จีน</div>
          <div className="sup-col-grid" style={{gridTemplateColumns:`repeat(${competitors.length},1fr)`}}>
            {competitors.map(c => (
              <CompetitorRow key={c.id} c={c}
                cmpRank={revRankById[c.id]||0}
                revCost={revCostById[c.id]||null}
                onChange={nc=>setCompetitors(prev=>prev.map(x=>x.id===c.id?nc:x))}
                onDelete={()=>setCompetitors(prev=>prev.filter(x=>x.id!==c.id))}
              />
            ))}
          </div>
          <button className="addrow-btn" onClick={()=>setCompetitors(prev=>[...prev,newCompetitor()])}><IconPlus /> เพิ่มร้าน / คู่แข่ง</button>
          <CompareRevResult results={revResults} />
        </div>
      </div>

      {/* Shared fees — full width */}
      <div className="fees-head" style={{marginTop:'16px'}}>
        <span className="ft">ค่าธรรมเนียม &amp; ภาษี</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <button className="reset-fees-btn" onClick={()=>setFees(demoFees())}>↺ มาตรฐาน</button>
          <span className="fc num">{fees.length} รายการ · ใช้ร่วมกัน</span>
        </div>
      </div>
      {fees.map(f => <FeeRow key={f.id} fee={f} onChange={(nf)=>updFee(f.id,nf)} onDelete={()=>delFee(f.id)} />)}
      <button className="addfee" onClick={addFee}><IconPlus /> เพิ่มค่าธรรมเนียม</button>

      <InvestmentSummary cmpResults={cmpResults} revResults={revResults} qty={qty} sell={effectiveSell} />

      <div className="hint" style={{paddingBottom:'80px'}}>ตัวเลขอัปเดตอัตโนมัติเมื่อพิมพ์ · อัตราแลกเปลี่ยนอัปเดตทุก 10 นาที</div>

      {/* Floating save button */}
      <button className={`fab-save${savedFlash?' flash':''}`} onClick={saveProduct} aria-label="บันทึก">
        <IconSave />
        {savedFlash ? 'บันทึกแล้ว ✓' : 'บันทึก'}
      </button>
      </>}
    </div>
  );
}

function App() {
  const { authed, login } = useAuth();
  if (!authed) return <LoginScreen onLogin={login} />;
  return <Main />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
